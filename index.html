<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>月の満ち欠け 3D実験室</title><style>
:root{color-scheme:dark;font-family:system-ui,'Noto Sans JP',sans-serif}*{box-sizing:border-box}body{margin:0;background:#080f22;color:#eef4ff}header{padding:13px 18px;background:#111d36;border-bottom:1px solid #34415b}h1{font-size:1.15rem;margin:0}header p{font-size:.78rem;color:#b7c9e7;margin:5px 0 0}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100dvh - 70px)}#scene{position:relative;min-height:360px;touch-action:none}canvas{display:block}#hint{position:absolute;bottom:14px;left:14px;background:#09152bc9;padding:8px 12px;border-radius:8px;font-size:.76rem;pointer-events:none}aside{overflow:auto;padding:18px;background:#111b31;border-left:1px solid #34415b}h2{font-size:1rem;margin:0 0 12px}label{display:block;font-size:.83rem;color:#c5d5f0;margin:14px 0 6px}input[type=range]{width:100%;accent-color:#e9bc6d}button{border:1px solid #566d92;border-radius:9px;background:#20365b;color:white;padding:10px 12px;cursor:pointer;font-size:.85rem}button:hover{background:#34517d}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.buttons button{flex:1}.primary{background:#315c9d}.readout{background:#0a152a;padding:12px;border-radius:10px;margin-top:15px}#phase{font-size:1.4rem;font-weight:700;color:#ffe4a5}#moonView{width:150px;height:150px;display:block;margin:10px auto}small{color:#b7c9e7;line-height:1.6;display:block}.stat{font-size:.86rem;margin-top:8px}.pill{font-size:.72rem;color:#ffe3ad}footer{font-size:.7rem;color:#aebed6;line-height:1.5;margin-top:18px}@media(max-width:760px){main{height:auto;display:block}#scene{height:55dvh;min-height:330px}aside{border-left:0;border-top:1px solid #34415b}header{min-height:70px}}
</style></head><body><header><h1>🌙 月の満ち欠け 3D実験室</h1><p>太陽・地球・月の位置関係から、月の見え方を考えよう</p></header><main><div id="scene"><div id="hint">1本指：視点回転 ／ 2本指：視点移動・拡大縮小<br>「太陽の方向」で光の向きを変更できます</div></div><aside><h2>実験コントロール</h2><div class="buttons"><button class="primary" id="play">▶ 再生</button><button id="reset">↺ リセット</button></div><label for="moonAngle">月の公転位置：<span id="moonDegrees">0°</span></label><input id="moonAngle" type="range" min="0" max="360" value="0" step="1"><label for="sunAngle">太陽の方向：<span id="sunDegrees">0°</span></label><input id="sunAngle" type="range" min="-180" max="180" value="0" step="1"><label for="speed">公転速度：<span id="speedText">1.0倍</span></label><input id="speed" type="range" min="0.25" max="3" value="1" step="0.25"><div class="readout"><div class="pill">地球から見た月</div><canvas id="moonView" width="300" height="300" aria-label="地球から見た月の形"></canvas><div id="phase" aria-live="polite">新月</div><div class="stat" id="illumination">明るい部分：0%</div><small id="description">月が太陽とほぼ同じ方向にあり、明るい面が地球から見えにくい状態です。</small></div><footer>学習用モデル：天体の大きさ・距離は実際と異なります。月の公転面の傾き、地球の自転、日食・月食の条件は簡略化しています。月の形は北半球からの標準的な見え方を模式的に表します。</footer></aside></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('scene');const scene=new THREE.Scene();scene.background=new THREE.Color(0x080f22);const camera=new THREE.PerspectiveCamera(48,1,.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=8;controls.maxDistance=65;controls.enablePan=true;controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;controls.touches.ONE=THREE.TOUCH.ROTATE;controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;
scene.add(new THREE.AmbientLight(0x8da9cf,.12));const sunLight=new THREE.PointLight(0xffffff,230,0,1.5);scene.add(sunLight);const earth=new THREE.Mesh(new THREE.SphereGeometry(1.45,48,32),new THREE.MeshStandardMaterial({color:0x3077bd,roughness:.8,metalness:0}));scene.add(earth);const land=new THREE.Mesh(new THREE.SphereGeometry(1.462,48,32),new THREE.MeshBasicMaterial({color:0x2d9b69,transparent:true,opacity:.78,side:THREE.FrontSide})); // simple continent shapes instead of false world map
const moon=new THREE.Mesh(new THREE.SphereGeometry(.55,40,28),new THREE.MeshStandardMaterial({color:0xc6c8c7,roughness:1}));scene.add(moon);const sun=new THREE.Mesh(new THREE.SphereGeometry(2,40,28),new THREE.MeshBasicMaterial({color:0xffc75d}));scene.add(sun);const glow=new THREE.PointLight(0xffb64a,3,12);sun.add(glow);
const orbitR=5.4,sunR=15;const orbitPts=[];for(let i=0;i<=180;i++){let a=i/180*Math.PI*2;orbitPts.push(new THREE.Vector3(orbitR*Math.cos(a),0,orbitR*Math.sin(a)))}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbitPts),new THREE.LineBasicMaterial({color:0x5d789b,transparent:true,opacity:.7})));
const grid=new THREE.GridHelper(32,16,0x24334d,0x1c2940);grid.position.y=-2.2;scene.add(grid);
const moonSlider=document.getElementById('moonAngle'),sunSlider=document.getElementById('sunAngle'),speedSlider=document.getElementById('speed'),playButton=document.getElementById('play');let moonDeg=0,sunDeg=0,playing=false,last=performance.now();
function resetCamera(){camera.position.set(0,9,19);controls.target.set(0,0,0);controls.update()}function reset(){playing=false;playButton.textContent='▶ 再生';moonDeg=180;sunDeg=0;moonSlider.value=moonDeg;sunSlider.value=sunDeg;speedSlider.value=1;resetCamera();update()}function update(){let ma=moonDeg*Math.PI/180,sa=sunDeg*Math.PI/180;moon.position.set(orbitR*Math.cos(ma),0,orbitR*Math.sin(ma));sun.position.set(sunR*Math.cos(sa),0,sunR*Math.sin(sa));sunLight.position.copy(sun.position);document.getElementById('moonDegrees').textContent=Math.round(moonDeg)+'°';document.getElementById('sunDegrees').textContent=Math.round(sunDeg)+'°';document.getElementById('speedText').textContent=Number(speedSlider.value).toFixed(2).replace(/0$/,'')+'倍';const relative=((moonDeg-sunDeg)%360+360)%360;let illum=(1-Math.cos(relative*Math.PI/180))/2;let names=['新月','三日月','上弦の月','十三夜ごろ','満月','寝待月ごろ','下弦の月','有明の月'];let idx=Math.floor(((relative+22.5)%360)/45);let descriptions=['月が太陽とほぼ同じ方向にあり、暗い面がこちらを向きます。','右側が細く光って見えます。','右半分が光って見えます。','右側が大きく光って見えます。','地球から月の明るい面がほぼ全体見えます。','左側が大きく光って見えます。','左半分が光って見えます。','左側が細く光って見えます。'];document.getElementById('phase').textContent=names[idx];document.getElementById('illumination').textContent='明るい部分：約'+Math.round(illum*100)+'%';document.getElementById('description').textContent=descriptions[idx];drawPhase(relative)}
function drawPhase(deg){const c=document.getElementById('moonView'),ctx=c.getContext('2d'),w=c.width,h=c.height,r=112,cx=w/2,cy=h/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0a152a';ctx.fillRect(0,0,w,h);ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.clip();ctx.fillStyle='#293448';ctx.fillRect(cx-r,cy-r,r*2,r*2);let f=(1-Math.cos(deg*Math.PI/180))/2;const waxing=deg<=180;ctx.fillStyle='#e4e4db';for(let y=-r;y<=r;y++){let x=Math.sqrt(Math.max(0,r*r-y*y));let boundary=x*(1-2*f);if(waxing){ctx.fillRect(cx+boundary,cy+y,Math.max(0,x-boundary),1.5)}else{ctx.fillRect(cx-x,cy+y,Math.max(0,boundary+x),1.5)}}ctx.restore();ctx.strokeStyle='#677a99';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,2*Math.PI);ctx.stroke()}
moonSlider.addEventListener('input',()=>{moonDeg=Number(moonSlider.value);update()});sunSlider.addEventListener('input',()=>{sunDeg=Number(sunSlider.value);update()});speedSlider.addEventListener('input',update);playButton.addEventListener('click',()=>{playing=!playing;playButton.textContent=playing?'⏸ 一時停止':'▶ 再生'});document.getElementById('reset').addEventListener('click',reset);
function resize(){let w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);reset();function frame(t){requestAnimationFrame(frame);let dt=Math.min((t-last)/1000,.1);last=t;if(playing){moonDeg=(moonDeg+dt*18*Number(speedSlider.value))%360;moonSlider.value=moonDeg;update()}controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
